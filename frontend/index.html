<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Cobros | Bienvenido</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            margin: 0; font-family: 'Segoe UI', sans-serif; color: white;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .landing-container { text-align: center; }
        .btn-main {
            padding: 16px 40px; font-size: 1.1rem; background: #3b82f6;
            color: white; border: none; border-radius: 50px; cursor: pointer;
            font-weight: 600; transition: 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .btn-main:hover { background: #2563eb; transform: scale(1.05); }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s ease;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: white; color: #111827; width: 420px; padding: 40px;
            border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center; position: relative; transform: translateY(20px); transition: 0.3s;
        }
        .overlay.active .modal-card { transform: translateY(0); }
        .close-btn {
            position: absolute; top: 20px; right: 20px; font-size: 1.5rem;
            cursor: pointer; color: #6b7280; border: none; background: none; line-height: 1;
        }
        .modal-card h2 { margin-top: 0; margin-bottom: 8px; font-size: 1.8rem; font-weight: 700; }
        .modal-card p { color: #4b5563; font-size: 0.95rem; margin-bottom: 32px; line-height: 1.5; }
        .btn-social {
            width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 12px;
            border: 1px solid #d1d5db; background: white; display: flex;
            align-items: center; justify-content: center; gap: 12px;
            font-weight: 500; cursor: pointer; transition: 0.2s; font-size: 0.95rem;
        }
        .btn-social:hover { background: #f9fafb; border-color: #9ca3af; }
        .divider { display: flex; align-items: center; margin: 24px 0; color: #9ca3af; }
        .divider hr { flex: 1; border: 0; border-top: 1px solid #e5e7eb; }
        .divider span { margin: 0 12px; font-size: 0.85rem; }
        input {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #d1d5db;
            margin-bottom: 16px; font-size: 1rem; outline: none; transition: 0.2s;
            color: #111827;
        }
        input:focus { border-color: #3b82f6; }
        .btn-black {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: #111827; color: white; font-weight: 600; cursor: pointer;
            font-size: 1rem; transition: 0.2s;
        }
        .btn-black:hover { background: #000; }
        .link-blue { color: #3b82f6; cursor: pointer; text-decoration: none; font-size: 0.85rem; font-weight: 500; }
        .link-blue:hover { text-decoration: underline; }
        .hidden { display: none !important; }
        #phoneHint { font-size: 0.75rem; color: #6b7280; margin-bottom: 10px; text-align: left; padding-left: 5px; line-height: 1.2; }
        #phoneHint b { color: #3b82f6; }
    </style>
</head>
<body>

    <div class="landing-container">
        <h1>Sistema de Cobros v1.0</h1>
        <button class="btn-main" onclick="openModal()">Iniciar Sesión</button>
    </div>

    <div id="authOverlay" class="overlay">
        <div class="modal-card">
            <button class="close-btn" onclick="closeModal()">×</button>
            
            <div id="authStep1">
                <h2>Bienvenido</h2>
                <p>Gestiona tus cobros de manera profesional.</p>
                <button id="btnGoogle" class="btn-social">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
                    Continuar con Google
                </button>
                <button id="btnTelefono" class="btn-social">
                    <span>📱</span> Continuar con el teléfono
                </button>
                <div class="divider"><hr><span>o</span><hr></div>
                <div id="phoneHint">ℹ️ Usa el indicativo (ej: <b>+57</b>3000000000)</div>
                <input type="text" id="quickIdentifier" placeholder="Correo o teléfono">
                <input type="password" id="quickPass" class="hidden" placeholder="Introduce tu contraseña">
                <button id="btnMainAction" class="btn-black">Continuar</button>
                <div style="margin-top: 20px;">
                    <a onclick="showStep('forgot')" class="link-blue">¿Olvidaste tu contraseña?</a>
                </div>
            </div>

            <div id="authStepForgot" class="hidden">
                <h2>Recuperar acceso</h2>
                <p>Enviaremos tu clave a tu correo.</p>
                <input type="email" id="forgotEmailInput" placeholder="Correo registrado">
                <button id="btnSendForgot" class="btn-black">Enviar contraseña</button>
                <div style="margin-top: 20px;"><a onclick="showStep('login')" class="link-blue">Volver</a></div>
            </div>

            <div id="authStepPhone" class="hidden">
                <h2 id="phoneHeader">Verificación</h2>
                <p id="phoneSub">Configura tu acceso.</p>
                <div id="recaptcha-container"></div>
                <input type="text" id="phoneInput" placeholder="+57 300 000 0000">
                <input type="text" id="smsInput" class="hidden" placeholder="Código SMS">
                <input type="password" id="passInput" class="hidden" placeholder="Crea tu contraseña">
                <button id="btnPhoneAction" class="btn-black">Enviar SMS</button>
                <div style="margin-top: 20px;"><a onclick="location.reload()" class="link-blue">Cancelar</a></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2Te-ZAbqQZvIts6FGUfg-ZqOycIP0RBQ",
            authDomain: "sistemacobros-8fc6b.firebaseapp.com",
            projectId: "sistemacobros-8fc6b",
            storageBucket: "sistemacobros-8fc6b.appspot.com",
            messagingSenderId: "705562752339",
            appId: "1:705562752339:web:6411f0b31f7614c3d11da6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // URLS ACTUALIZADAS (Backend en Render)
        const API = "https://sistema-cobro-backend-gqse.onrender.com/api";
        const socket = io('https://sistema-cobro-backend-gqse.onrender.com');

        window.openModal = () => document.getElementById('authOverlay').classList.add('active');
        window.closeModal = () => document.getElementById('authOverlay').classList.remove('active');

        window.showStep = (step) => {
            ['authStep1', 'authStepForgot', 'authStepPhone'].forEach(s => document.getElementById(s).classList.add('hidden'));
            if(step === 'login') document.getElementById('authStep1').classList.remove('hidden');
            if(step === 'forgot') document.getElementById('authStepForgot').classList.remove('hidden');
            if(step === 'phone') document.getElementById('authStepPhone').classList.remove('hidden');
        };

        // --- MANEJO DE REDIRECCIÓN DE GOOGLE ---
        getRedirectResult(auth).then(async (result) => {
            if (result) {
                const user = result.user;
                const checkRes = await fetch(`${API}/check-user?email=${user.email}`);
                const checkData = await checkRes.json();
                if (checkData.exists) {
                    localStorage.setItem('usuario', JSON.stringify(checkData.user));
                    location.href = 'dashboard.html';
                } else {
                    showStep('phone');
                    document.getElementById('phoneHeader').innerText = "Finalizar Registro";
                    document.getElementById('phoneInput').classList.add('hidden');
                    document.getElementById('passInput').classList.remove('hidden');
                    const btn = document.getElementById('btnPhoneAction');
                    btn.innerText = "Crear Cuenta";
                    btn.onclick = async () => {
                        const password = document.getElementById('passInput').value;
                        const regRes = await fetch(`${API}/register`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ nombre: user.displayName, email: user.email, password: password })
                        });
                        if(regRes.ok) {
                            const d = await regRes.json();
                            localStorage.setItem('usuario', JSON.stringify(d.user));
                            location.href = 'dashboard.html';
                        }
                    };
                }
            }
        }).catch(e => console.error("Error Google Redirect:", e));

        const provider = new GoogleAuthProvider();
        document.getElementById('btnGoogle').onclick = () => signInWithRedirect(auth, provider);

        // --- LOGIN MANUAL ---
        let loginPhase = 'identifier';
        let userIdentifier = '';
        document.getElementById('btnMainAction').onclick = async () => {
            const input = document.getElementById('quickIdentifier');
            const pass = document.getElementById('quickPass');
            const btn = document.getElementById('btnMainAction');

            if (loginPhase === 'identifier') {
                userIdentifier = input.value.trim();
                if(!userIdentifier) return alert("Ingresa datos");
                input.classList.add('hidden');
                pass.classList.remove('hidden');
                loginPhase = 'password';
                btn.innerText = "Entrar";
            } else {
                try {
                    const res = await fetch(`${API}/login`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ identifier: userIdentifier, password: pass.value })
                    });
                    const data = await res.json();
                    if(data.success) {
                        localStorage.setItem('usuario', JSON.stringify(data.user));
                        location.href = 'dashboard.html';
                    } else { alert(data.error); }
                } catch (e) { alert("Error servidor"); }
            }
        };

        // --- SMS ---
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {'size': 'invisible'});
        document.getElementById('btnTelefono').onclick = () => showStep('phone');
    </script>
</body>
</html>
